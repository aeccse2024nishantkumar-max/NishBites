<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NishBites - Login</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- HEADER -->
    <header>
        <div class="logo">
            🍔 <span>NishBites</span>
        </div>

        <nav>
            <a href="index.html">Home</a>
            <a href="index.html#menu">Menu</a>
        </nav>
    </header>


    <!-- LOGIN SECTION -->
    <main class="login-page">

        <div class="login-box">

            <div class="login-icon">
                🍔
            </div>

            <h1>Welcome to NishBites</h1>

            <p>Login to continue</p>


            <form onsubmit="loginUser(event)">

                <!-- NAME -->
                <label for="name">
                    Name
                </label>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter your name"
                    required
                >


                <!-- PHONE -->
                <label for="phone">
                    Phone Number
                </label>

                <input
                    type="tel"
                    id="phone"
                    placeholder="Enter your phone number"
                    maxlength="10"
                    required
                >


                <!-- PASSWORD -->
                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >


                <!-- LOGIN BUTTON -->
                <button type="submit" class="login-btn">
                    Login
                </button>

            </form>


            <p id="loginMessage"></p>


            <div class="login-links">

                <a href="index.html">
                    ← Back to Home
                </a>

            </div>

        </div>

    </main>


    <!-- FOOTER -->
    <footer>

        <h3>🍔 NishBites</h3>

        <p>Good Food • Good Mood</p>

        <p>© 2026 NishBites. All Rights Reserved.</p>

    </footer>


    <!-- JAVASCRIPT -->
    <script src="app.js"></script>

</body>
</html>
